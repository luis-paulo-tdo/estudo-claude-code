<div class="modal-backdrop">
  <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="bulk-modal-title">

    <div class="modal__header">
      <h2 id="bulk-modal-title">Lançamento em Massa</h2>
      <button class="btn btn--ghost btn--sm" (click)="cancelled.emit()" aria-label="Fechar diálogo">✕</button>
    </div>

    <!-- Cabeçalho compartilhado -->
    <div class="bulk-header">
      <div class="form-row">
        <div class="form-group">
          <label for="b-type">Tipo</label>
          <select id="b-type" [(ngModel)]="header.type">
            <option value="Expense">Despesa</option>
            <option value="Income">Receita</option>
          </select>
        </div>
        <div class="form-group">
          <label for="b-date">Data / Hora</label>
          <input id="b-date" type="datetime-local" [(ngModel)]="header.date" />
        </div>
        <div class="form-group">
          <label for="b-establishment">Estabelecimento <span class="optional">(opcional)</span></label>
          <select id="b-establishment" [(ngModel)]="header.establishmentId">
            <option [ngValue]="null">Nenhum</option>
            @for (e of establishments(); track e.id) {
              <option [value]="e.id">{{ e.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <!-- Itens -->
    <div class="bulk-items">
      <div class="bulk-items__header">
        <span class="col-cat">Categoria</span>
        <span class="col-desc">Descrição</span>
        <span class="col-qty">Qtd</span>
        <span class="col-unit">Unidade</span>
        <span class="col-uprice">Preço/Un.</span>
        <span class="col-amount">Valor (R$)</span>
        <span class="col-action"></span>
      </div>

      @for (item of items; track trackByIndex($index)) {
        <div class="bulk-item">
          <div class="col-cat">
            <select [(ngModel)]="item.categoryId" [attr.aria-label]="'Categoria do item ' + ($index + 1)">
              <option value="">Categoria...</option>
              @for (cat of categories(); track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>
          <div class="col-desc">
            <input type="text" [(ngModel)]="item.description" placeholder="Descrição..." [attr.aria-label]="'Descrição do item ' + ($index + 1)" />
          </div>
          <div class="col-qty">
            <input type="number" min="0" step="0.001" [(ngModel)]="item.quantity" placeholder="—" [attr.aria-label]="'Quantidade do item ' + ($index + 1)" />
          </div>
          <div class="col-unit">
            <select [(ngModel)]="item.unit" [attr.aria-label]="'Unidade do item ' + ($index + 1)">
              <option [ngValue]="null">—</option>
              @for (u of UNITS; track u) {
                <option [value]="u">{{ u }}</option>
              }
            </select>
          </div>
          <div class="col-uprice">
            <input type="number" min="0" step="0.01" [(ngModel)]="item.unitPrice" placeholder="—" [attr.aria-label]="'Preço por unidade do item ' + ($index + 1)" />
          </div>
          <div class="col-amount">
            <input type="number" min="0" step="0.01" [(ngModel)]="item.amount" placeholder="0,00" [attr.aria-label]="'Valor do item ' + ($index + 1)" />
          </div>
          <div class="col-action">
            <button class="btn-remove" (click)="removeItem($index)" [disabled]="items.length === 1" aria-label="Remover item">✕</button>
          </div>
        </div>
      }
    </div>

    <div class="bulk-footer">
      <button class="btn btn--ghost" (click)="addItem()">+ Adicionar item</button>
      <div class="bulk-total">
        Total: <strong>{{ total | currency:'BRL':'symbol':'1.2-2' }}</strong>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn btn--ghost" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn btn--primary" (click)="save()" [disabled]="!canSave || saving()">
        {{ saving() ? 'Salvando...' : 'Salvar ' + items.length + (items.length === 1 ? ' item' : ' itens') }}
      </button>
    </div>

  </div>
</div>
